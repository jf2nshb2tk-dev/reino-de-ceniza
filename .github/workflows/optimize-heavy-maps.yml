name: Optimizar carga de mapas pesados
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/optimize-heavy-maps.yml
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Aplicar carga progresiva
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()

          old="function putEnv(mi,g,path,x,z,s,ry,tint,col){const o=cloneEnv(path,tint);o.position.set(x,mapLocalH(mi,x,z),z);o.rotation.y=ry||0;o.scale.setScalar(s||1);g.add(o);if(col)addMapCol(mi,x,z,col*(s||1));return o;}"
          new="""let heavyEnvQueue=null;
function putEnvNow(mi,g,path,x,z,s,ry,tint,col){const o=cloneEnv(path,tint);o.position.set(x,mapLocalH(mi,x,z),z);o.rotation.y=ry||0;o.scale.setScalar(s||1);g.add(o);if(col)addMapCol(mi,x,z,col*(s||1));return o;}
function putEnv(mi,g,path,x,z,s,ry,tint,col){if(heavyEnvQueue&&(mi===1||mi===3)){heavyEnvQueue.push([mi,g,path,x,z,s,ry,tint,col]);return null;}return putEnvNow(mi,g,path,x,z,s,ry,tint,col);}
const mapYield=()=>new Promise(r=>requestAnimationFrame(()=>r()));
function setMapLoadText(mi,msg){const el=document.querySelector('#mapLoadName');if(el)el.textContent=msg||('Viajando a '+GAME_MAPS[mi].name+'…');}"""
          if old not in s: raise SystemExit('putEnv pattern not found')
          s=s.replace(old,new,1)

          old="async function prepareMapAssets(mi){const q=MAP_REQ[mi];await Promise.all(q.mon.map(needMonster).concat(q.env.map(needEnv)));}"
          new="""async function prepareMapAssets(mi){
  const q=MAP_REQ[mi],heavy=mi===1||mi===3;
  if(!heavy){await Promise.all(q.mon.map(needMonster).concat(q.env.map(needEnv)));return;}
  const total=q.mon.length+q.env.length;let done=0;
  for(const name of q.mon){setMapLoadText(mi,'Cargando '+GAME_MAPS[mi].name+' · modelos '+(++done)+'/'+total);await needMonster(name);await mapYield();}
  for(const path of q.env){setMapLoadText(mi,'Cargando '+GAME_MAPS[mi].name+' · escenario '+(++done)+'/'+total);await needEnv(path);await mapYield();}
}"""
          if old not in s: raise SystemExit('prepareMapAssets pattern not found')
          s=s.replace(old,new,1)

          a=s.index('function spawnMapPopulation(mi)')
          b=s.index('async function ensureMap(mi)',a)
          new_pop="""async function spawnMapPopulation(mi){
  const R=rngMap(7000+mi),jobs=[];
  const add=(...args)=>jobs.push(args);
  function wave(t,n,test){let c=0,k=0;while(c<n&&k<n*80){k++;const x=(R()*2-1)*(LIMIT-7),z=(R()*2-1)*(LIMIT-7);if(Math.hypot(x,z-6)<22||z<-56||!test(x,z))continue;if(mi===2&&MAP_LAVA[2].some(p=>Math.hypot(x-p.x,z-p.z)<p.r+4))continue;add(t,x,z,undefined,mi);c++;}}
  if(mi===1){wave('frost_orc',12,()=>true);wave('frost_tribal',10,(x,z)=>x<35);wave('yeti',7,(x,z)=>Math.abs(x)>24||z<0);add('yeti_glacial',-28,-72,12,mi);add('yeti_alfa',28,-72,14,mi);}
  else if(mi===2){wave('dino_fire',11,()=>true);wave('armabee_fire',11,()=>true);wave('goleling_fire',8,(x,z)=>Math.abs(x)>20);add('dragon_ancient',-30,-72,16,mi);add('dragon_evolved',30,-72,18,mi);}
  else if(mi===3){wave('ghost_mob',14,()=>true);wave('orc_skull',13,(x,z)=>z<30);add('ghost_skull_lord',-28,-72,20,mi);add('skull_warlord',28,-72,22,mi);}
  else{wave('ruin_orc',12,()=>true);wave('mushroom_corrupt',10,(x,z)=>x<35);wave('golem_guard',9,(x,z)=>Math.abs(x)>18);add('golem_evolved_boss',-30,-72,24,mi);add('blue_demon_boss',30,-72,26,mi);}
  const heavy=mi===1||mi===3,chunk=heavy?3:8;
  for(let i=0;i<jobs.length;i++){
    spawnEnemy(...jobs[i]);
    if((i+1)%chunk===0){if(heavy)setMapLoadText(mi,'Preparando criaturas '+(i+1)+'/'+jobs.length);await mapYield();}
  }
}"""
          s=s[:a]+new_pop+'\n'+s[b:]

          old="async function ensureMap(mi){if(mapBuilt[mi])return;await prepareMapAssets(mi);const g=new THREE.Group();g.position.y=MAP_Y[mi];g.visible=false;scene.add(g);const terr=makeTerrain(mi);g.add(terr);mapGroups[mi]=g;mapTerrains[mi]=terr;buildScenery(mi,g);spawnMapPopulation(mi);mapBuilt[mi]=true;}"
          new="""async function ensureMap(mi){
  if(mapBuilt[mi])return;
  await prepareMapAssets(mi);
  setMapLoadText(mi,'Generando terreno de '+GAME_MAPS[mi].name+'…');
  await mapYield();
  const g=new THREE.Group();g.position.y=MAP_Y[mi];g.visible=false;scene.add(g);
  const terr=makeTerrain(mi);g.add(terr);mapGroups[mi]=g;mapTerrains[mi]=terr;
  await mapYield();
  if(mi===1||mi===3){
    heavyEnvQueue=[];
    buildScenery(mi,g);
    const jobs=heavyEnvQueue;heavyEnvQueue=null;
    for(let i=0;i<jobs.length;i++){
      putEnvNow(...jobs[i]);
      if((i+1)%4===0){setMapLoadText(mi,'Armando escenario '+(i+1)+'/'+jobs.length);await mapYield();}
    }
  }else buildScenery(mi,g);
  await spawnMapPopulation(mi);
  mapBuilt[mi]=true;
  setMapLoadText(mi,'Entrando a '+GAME_MAPS[mi].name+'…');
  await mapYield();
}"""
          if old not in s: raise SystemExit('ensureMap pattern not found')
          s=s.replace(old,new,1)

          old="const seg=isTouch?96:126,geo=new THREE.PlaneGeometry(WORLD,WORLD,seg,seg);"
          new="const seg=isTouch?((mi===1||mi===3)?72:88):126,geo=new THREE.PlaneGeometry(WORLD,WORLD,seg,seg);"
          if old in s: s=s.replace(old,new,1)

          p.write_text(s)
          PY
      - name: Validar JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          blocks=re.findall(r'<script>([\s\S]*?)</script>',s)
          Path('/tmp/game.js').write_text(blocks[-1])
          PY
          node --check /tmp/game.js
      - name: Guardar optimización
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/optimize-heavy-maps.yml .github/workflows/diag-heavy-maps.yml .github/workflows/extract-map-diag.yml diag-snippets.txt
          git add index.html .github/workflows/optimize-heavy-maps.yml .github/workflows/diag-heavy-maps.yml .github/workflows/extract-map-diag.yml diag-snippets.txt
          git commit -m 'Optimizar carga de Montaña Helada y Reino de los Muertos'
          git push origin HEAD:main
