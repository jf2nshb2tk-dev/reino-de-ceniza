name: Fix snow map
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-snow-v2.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch
        run: echo '' | base64 -d | python3
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/fix-snow-v2.yml .github/workflows/fix-snow-visibility.yml
          git add index.html sw.js .github/workflows/fix-snow-v2.yml .github/workflows/fix-snow-visibility.yml
          git commit -m 'Fix snow map visibility'
          git push origin HEAD:main