name: Instalar paquete Reino de Ceniza

on:
  push:
    branches: ["main"]
    paths:
      - "Reino_de_Ceniza_5_Mapas.zip"
      - ".github/workflows/unpack-game.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "install-game"
  cancel-in-progress: true

jobs:
  install-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Descomprimir paquete
        shell: bash
        run: |
          set -euo pipefail
          test -f Reino_de_Ceniza_5_Mapas.zip
          rm -rf .rdc_unpack
          mkdir .rdc_unpack
          unzip -q Reino_de_Ceniza_5_Mapas.zip -d .rdc_unpack
          test -f .rdc_unpack/Reino_de_Ceniza_5_Mapas/index.html
          test -d .rdc_unpack/Reino_de_Ceniza_5_Mapas/assets

      - name: Instalar juego nuevo
        shell: bash
        run: |
          set -euo pipefail
          rm -rf assets
          cp .rdc_unpack/Reino_de_Ceniza_5_Mapas/index.html ./index.html
          cp -R .rdc_unpack/Reino_de_Ceniza_5_Mapas/assets ./assets
          rm -rf .rdc_unpack
          rm -f Reino_de_Ceniza_5_Mapas.zip
          rm -f .github/workflows/unpack-game.yml

      - name: Guardar archivos descomprimidos en main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No hay cambios para guardar"
          else
            git commit -m "Instalar Reino de Ceniza con 5 mapas"
            git push origin HEAD:main
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
