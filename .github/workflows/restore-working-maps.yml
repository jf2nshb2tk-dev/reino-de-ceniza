name: Restaurar mapas funcionales

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/restore-working-maps.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Restaurar index funcional anterior
        shell: bash
        run: |
          set -euo pipefail
          git show e744fbe91b28ca305b438b0537db24b0539b140e:index.html > index.html
          python - <<'PY'
          from pathlib import Path
          p=Path('sw.js')
          s=p.read_text()
          s=s.replace('reino-ceniza-v12','reino-ceniza-v14').replace('reino-ceniza-v13','reino-ceniza-v14')
          p.write_text(s)
          PY
          rm -f .github/workflows/restore-working-maps.yml

      - name: Guardar restauración
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js .github/workflows/restore-working-maps.yml
          git commit -m "Restaurar carga funcional de los mapas"
          git push origin HEAD:main
