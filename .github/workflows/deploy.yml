name: Deploy Reino de Ceniza to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Preparar piezas Quaternius T5
        shell: bash
        run: |
          mkdir -p assets/quaternius
          python3 -m pip install --quiet gdown
          gdown 15eAmpUglpZc5qjlDRThb3cvqmPvvihPD -O assets/quaternius/Warrior.obj
          gdown 1QJt-p0iRezGKUQlMQP_mnYlnnK_KfRDt -O assets/quaternius/Wizard.obj
          gdown 12vOwOHcZwxxV7l2KK-HUdLefL-MRiqHf -O assets/quaternius/Ranger.obj
          python3 - <<'PY'
          from pathlib import Path
          expected={'Warrior.obj':459385,'Wizard.obj':463856,'Ranger.obj':312961}
          for name,size in expected.items():
              p=Path('assets/quaternius')/name
              t=p.read_text(errors='ignore')
              if p.stat().st_size!=size or '\nv ' not in '\n'+t or '\no ' not in '\n'+t:
                  raise SystemExit(f'OBJ Quaternius invalido: {name} ({p.stat().st_size})')
              print(name,p.stat().st_size)
          PY

      - name: Aplicar ajustes para iPhone
        run: python3 .github/scripts/patch_game.py

      - name: Aplicar progresión de niveles y drops
        run: python3 .github/scripts/progression_patch.py

      - name: Aplicar reset MU y drop +15
        run: python3 .github/scripts/reset_patch.py

      - name: Aplicar filtros de loot y venta por color
        run: python3 .github/scripts/loot_filter_patch.py

      - name: Aplicar balance de combate y experiencia
        run: python3 .github/scripts/balance_patch.py

      - name: Corregir velocidad del personaje
        run: python3 .github/scripts/speed_fix_patch.py

      - name: Compactar inventario estilo MU
        run: python3 .github/scripts/compact_inventory_patch.py

      - name: Aplicar armaduras visuales por tier
        run: python3 .github/scripts/armor_visual_patch.py

      - name: Aplicar cinco tiers del Guerrero
        run: python3 .github/scripts/warrior_armor_patch.py

      - name: Neutralizar traje base del Guerrero
        run: python3 .github/scripts/warrior_base_skin_patch.py

      - name: Corregir casco del Guerrero
        run: python3 .github/scripts/warrior_helmet_fix_patch.py

      - name: Aplicar cinco tiers del Mago
        run: python3 .github/scripts/mage_armor_patch.py

      - name: Aplicar cinco tiers del Elfo
        run: python3 .github/scripts/elf_armor_patch.py

      - name: Aplicar Barbaro Asesino y Brujo
        run: python3 .github/scripts/remaining_armor_patch.py

      - name: Aplicar piezas Quaternius como armaduras T5
        shell: bash
        run: |
          python3 .github/scripts/quaternius_t5_patch.py
          rm -rf assets/quaternius

      - name: Mantener visibles acciones del inventario
        run: python3 .github/scripts/inventory_detail_fix_patch.py

      - name: Reforzar carga de mapas pesados en iPhone
        run: python3 .github/scripts/heavy_map_stability_patch.py

      - name: Validar JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          blocks=re.findall(r'<script>([\s\S]*?)</script>',s)
          if not blocks:
              raise SystemExit('No se encontro el bloque JavaScript')
          Path('/tmp/game.js').write_text(blocks[-1])
          PY
          node --check /tmp/game.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
