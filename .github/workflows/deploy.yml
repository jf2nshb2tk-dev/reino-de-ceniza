name: Deploy Reino de Ceniza to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Aplicar ajustes para iPhone
        run: python3 .github/scripts/patch_game.py

      - name: Aplicar progresión de niveles y drops
        run: python3 .github/scripts/progression_patch.py

      - name: Aplicar reset MU y drop +15
        run: python3 .github/scripts/reset_patch.py

      - name: Validar JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          blocks=re.findall(r'<script>([\s\S]*?)</script>',s)
          if not blocks:
              raise SystemExit('No se encontro el bloque JavaScript')
          Path('/tmp/game.js').write_text(blocks[-1])
          PY
          node --check /tmp/game.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
