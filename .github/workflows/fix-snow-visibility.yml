name: Corregir visibilidad nieve

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-snow-visibility.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Ajustar nieve sin cambiar estructura del mapa
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          old="""  if(mi===1){
    const ice=ss(.38,.78,n2);r=lerp(.72,.92,ice);g=lerp(.78,.95,ice);b=lerp(.82,1,ice);
    if(n<.28){r*=.72;g*=.78;b*=.82;}
  }else if(mi===2){"""
          new="""  if(mi===1){
    // Nieve azul-gris: conserva contraste aun con bloom y niebla en iPhone.
    const ice=ss(.38,.78,n2);r=lerp(.44,.70,ice);g=lerp(.52,.78,ice);b=lerp(.60,.86,ice);
    if(n<.30){r*=.68;g*=.73;b*=.79;}
    if(h>4){const cap=clamp((h-4)/12,0,.08);r+=cap;g+=cap;b+=cap;}
  }else if(mi===2){"""
          if old not in s: raise SystemExit('No se encontró bloque de color de nieve')
          s=s.replace(old,new,1)

          old="1:{fog:new THREE.Color(0x9aabb7),hemi:new THREE.Color(0xd9edff),top:new THREE.Color(0x334b68),near:38,far:132,star:.15},"
          new="1:{fog:new THREE.Color(0x617487),hemi:new THREE.Color(0xa9bfd2),top:new THREE.Color(0x1d3147),near:42,far:128,star:.06},"
          if old not in s: raise SystemExit('No se encontró atmósfera de nieve')
          s=s.replace(old,new,1)

          old="fg.color.lerp(A.fog,k);scene.background.copy(fg.color);fg.near+=(A.near-fg.near)*k;fg.far+=(A.far-fg.far)*k;hemi.color.lerp(A.hemi,k);"
          new="fg.color.lerp(A.fog,k);scene.background.copy(fg.color);fg.near+=(A.near-fg.near)*k;fg.far+=(A.far-fg.far)*k;hemi.color.lerp(A.hemi,k);if(currentMap===1){hemi.intensity+=(.58-hemi.intensity)*k;if(bloom){bloom.strength=.22;bloom.threshold=.9;bloom.radius=.32;}}"
          if old not in s: raise SystemExit('No se encontró actualización atmosférica')
          s=s.replace(old,new,1)

          old="const nm=Math.hypot(P.x-MERCH.x,P.z-MERCH.z)<7;els.shop.hidden=!(nm&&!panelOpen&&!P.dead);"
          new="const nm=currentMap===0&&Math.hypot(P.x-MERCH.x,P.z-MERCH.z)<7;els.shop.hidden=!(nm&&!panelOpen&&!P.dead);"
          if old not in s: raise SystemExit('No se encontró visibilidad de Herrero')
          s=s.replace(old,new,1)

          p.write_text(s)

          sw=Path('sw.js')
          x=sw.read_text()
          import re
          x=re.sub(r'reino-ceniza-v\\d+', 'reino-ceniza-v15', x, count=1)
          sw.write_text(x)
          PY

      - name: Validar JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          blocks=re.findall(r'<script>([\s\S]*?)</script>',s)
          Path('/tmp/game.js').write_text(blocks[-1])
          PY
          node --check /tmp/game.js

      - name: Guardar cambios
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-snow-visibility.yml
          git add index.html sw.js .github/workflows/fix-snow-visibility.yml
          git commit -m "Corregir exposición y Herrero en Montaña Helada"
          git push origin HEAD:main