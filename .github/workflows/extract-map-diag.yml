name: Extraer diagnostico mapas
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/extract-map-diag.yml
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Extraer bloques
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          out=[]
          keys=['function putEnv','function buildScenery(mi,g)','function spawnMapPopulation(mi)','function ensureMap','function travelToMap','function travelMap','async function load','GLTFLoader']
          for key in keys:
              i=s.find(key)
              if i>=0:
                  out.append('\n===== '+key+' =====\n'+s[i:i+18000])
          Path('diag-snippets.txt').write_text('\n'.join(out))
          PY
      - name: Guardar diagnostico
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diag-snippets.txt
          git commit -m 'Extraer diagnostico temporal de mapas' || exit 0
          git push origin HEAD:main
